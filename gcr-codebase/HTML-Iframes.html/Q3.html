<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiple Iframes</title>
</head>
<body>

<h1>My Web Pages</h1>

<iframe
    srcdoc="
        <html>
        <body>
            <h2>My Introduction</h2>
            <p>
                Hello! My name is Tanya Verma.
                I am interested in programming and web development.
            </p>
        </body>
        </html>
    "
    width="600"
    height="250"
    title="My Introduction">
</iframe>

<br><br>

<iframe
    srcdoc="
        <html>
        <body>
            <h2>My Favorite Hobby</h2>
            <p>
                My favorite hobby is listening to music
                and exploring new technologies.
            </p>
        </body>
        </html>
    "
    width="600"
    height="250"
    title="My Favorite Hobby">
</iframe>

</body>
</html>
