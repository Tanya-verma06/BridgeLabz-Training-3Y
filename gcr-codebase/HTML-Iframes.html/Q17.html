<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

<h1>Simple Form</h1>

<form action="result.html" target="resultFrame">

    <label for="name">Enter Your Name:</label>

    <input
        type="text"
        id="name"
        name="name"
        required>

    <br><br>

    <input type="submit" value="Submit">

</form>

<br>

<iframe
    name="resultFrame"
    src=""
    width="500"
    height="200"
    title="Result">
</iframe>

</body>
</html>
