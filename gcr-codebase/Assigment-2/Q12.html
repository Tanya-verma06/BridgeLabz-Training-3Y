<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        I am <strong>passionate</strong> about technology and
        <em>always excited</em> to learn something new.
        <mark>Coding</mark> helps me grow every day.
        <br>
        <small>Keep learning and keep improving!</small>
    </p>

</body>
</html>
