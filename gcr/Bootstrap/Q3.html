</head>
<body>

<header class="bg-dark text-white p-3">

<!-- Bootstrap grid: one column on mobile, two on small screens, four on desktop -->
<section class="row g-4">

            <div class="card-body">
                <h3 class="h5">Headphones</h3>
                <p class="fw-bold">₹2,499</p>
                <a href="#" class="btn btn-primary w-100">Add to Cart</a>
            </div>
        </article>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="card-img-top product-img" alt="Wristwatch">
            <div class="card-body">
                <h3 class="h5">Wristwatch</h3>
                <p class="fw-bold">₹1,899</p>
                <a href="#" class="btn btn-primary w-100">Add to Cart</a>
            </div>
        </article>
    </div>

    <div class="col-12 col-sm-6 col-md-3">

                <p class="fw-bold">₹3,299</p>

            </div>
        </article>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80" class="card-img-top product-img" alt="Camera">
