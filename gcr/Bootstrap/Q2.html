<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>


<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">


</head>
<body class="bg-light text-dark">

<header class="bg-white shadow-sm py-4">
    <div class="container text-center">
        <h1 class="fw-bold">Tanya Verma</h1>
        <p class="lead">Computer Science Student | Web Developer</p>
    </div>
</header>

<main class="container my-5">


<section class="text-center bg-white rounded shadow-sm p-5">
    <!-- img-fluid makes the image responsive -->
    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80"
         class="img-fluid rounded-circle profile-img mb-3"
         alt="Profile photo">

    <h2 class="fw-bold">Hello, I'm Tanya!</h2>

    <p class="text-secondary">
        I am a Computer Science student interested in web development,
        cloud computing, and building useful digital products.
    </p>

    <a href="mailto:hello@example.com" class="btn btn-primary mt-3">Hire Me</a>
    <a href="#" class="btn btn-outline-primary mt-3">Download CV</a>
</section>

<section class="mt-5">
    <h2 class="text-center mb-4">Contact Me</h2>

    <form class="contact-form mx-auto">
        <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="4" placeholder="Write your message"></textarea>
        </div>

        <button type="submit" class="btn btn-dark w-100">Send Message</button>
    </form>
</section>


</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026 Tanya Verma</p>
</footer>

</body>
</html>
