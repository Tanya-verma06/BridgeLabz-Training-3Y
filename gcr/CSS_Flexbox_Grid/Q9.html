<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="Q9.css">
</head>

<body>

    <div class="card">

        <div class="card-inner">

            <div class="front">
                <img src="https://picsum.photos/300/200" alt="Nature">
                <h2>Nature</h2>
            </div>

            <div class="back">
                <h2>About Nature</h2>
                <p>
                    Nature includes forests, mountains, rivers and
                    many beautiful parts of our environment.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
