<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            text-align: center;
        }

        h1 {
            text-shadow: 3px 3px 5px gray;
            margin: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;
            background-color: white;
            transition: 0.4s ease;
        }

        .card1 {
            box-shadow: 5px 5px 10px gray;
        }

        .card2 {
            box-shadow: 0 0 20px gray;
        }

        .card3 {
            box-shadow: 10px 10px 20px gray;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 10px 15px 25px gray;
        }

        .card h2 {
            text-shadow: 2px 2px 4px gray;
        }
    </style>
</head>

<body>

    <header>
        <h1>Shadows and Depth Effects</h1>
    </header>

    <main class="container">

        <section class="card card1">
            <h2>Profile 1</h2>
            <p>This card uses a basic shadow.</p>
        </section>

        <section class="card card2">
            <h2>Profile 2</h2>
            <p>This card uses a soft shadow.</p>
        </section>

        <section class="card card3">
            <h2>Profile 3</h2>
            <p>This card uses a large shadow.</p>
        </section>

    </main>

</body>
</html>
