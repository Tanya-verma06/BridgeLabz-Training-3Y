<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eeeeee;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            width: 90%;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: auto;
            min-height: 100px;
            max-width: 250px;
            padding: 20px;
        }

        .box1 {
            width: 200px;
            height: 150px;
            background-color: lightblue;
        }

        .box2 {
            width: 30%;
            height: 25vh;
            background-color: lightgreen;
        }

        .box3 {
            width: 15em;
            height: 12em;
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="box box1">
            <h2>200px × 150px</h2>
        </section>

        <section class="box box2">
            <h2>30% × 25vh</h2>
        </section>

        <section class="box box3">
            <h2>15em × 12em</h2>
        </section>

    </main>

</body>
</html>
