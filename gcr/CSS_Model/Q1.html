<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 180px;
            background-color: white;
            padding: 25px;
            border: 5px solid black;
            transition: border-color 0.3s ease;
        }

        .solid {
            border-style: solid;
        }

        .dashed {
            border-style: dashed;
        }

        .double {
            border-style: double;
        }

        .groove {
            border-style: groove;
        }

        .rounded {
            border-radius: 25px;
        }

        .box:hover {
            border-color: red;
        }

        .padding-small {
            padding: 10px;
        }

        .padding-medium {
            padding: 25px;
        }

        .padding-large {
            padding: 45px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>
        <section class="container">

            <div class="box solid padding-small">
                <h2>Solid</h2>
                <p>Small Padding</p>
            </div>

            <div class="box dashed padding-medium">
                <h2>Dashed</h2>
                <p>Medium Padding</p>
            </div>

            <div class="box double padding-large rounded">
                <h2>Double</h2>
                <p>Large Padding</p>
            </div>

            <div class="box groove padding-medium rounded">
                <h2>Groove</h2>
                <p>Rounded Corners</p>
            </div>

        </section>
    </main>

</body>
</html>
