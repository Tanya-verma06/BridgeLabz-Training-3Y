<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #222;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 20px 30px;
            border: 1px solid #555;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #555;
            transform: translateY(-3px);
        }

        nav a.active {
            background-color: #007bff;
            border-bottom: 4px solid white;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        footer {
            padding: 20px;
            text-align: center;
            background-color: #222;
            color: white;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
            }

            nav a {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <header>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main>

        <section>
            <h1>Welcome to My Website</h1>
            <p>This page demonstrates a responsive navigation bar.</p>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
