<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

<h1>Travel Selection Page</h1>

<label for="country">Country:</label>

<select id="country">
    <option selected>India</option>
    <option>USA</option>
    <option>Japan</option>
    <option>France</option>
</select>

<br><br>

<label for="state">State:</label>

<select id="state">
    <option selected>Uttar Pradesh</option>
    <option>Rajasthan</option>
    <option>Goa</option>
    <option>Maharashtra</option>
</select>

<br><br>

<label for="city">City:</label>

<select id="city">
    <option selected>Mathura</option>
    <option>Agra</option>
    <option>Jaipur</option>
    <option>Mumbai</option>
</select>

<br><br>

<label for="place">Favorite Tourist Place:</label>

<select id="place">
    <option selected>Taj Mahal</option>
    <option>Gateway of India</option>
    <option>Goa Beaches</option>
    <option>Hawa Mahal</option>
</select>

<p>
    My choices are: India, Uttar Pradesh, Mathura, and my favorite
    tourist place is the Taj Mahal.
</p>

</body>
</html>
