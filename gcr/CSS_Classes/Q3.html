<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
        }

        figure {
            margin: 0;
            overflow: hidden;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px gray;
        }

        .image-container {
            position: relative;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }

        .image-container::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0);
            transition: 0.4s;
        }

        figure:hover img {
            transform: scale(1.1);
        }

        figure:hover .image-container::after {
            background-color: rgba(0, 0, 0, 0.35);
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=1" alt="Nature">
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=2" alt="Mountain">
            </div>
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=3" alt="Beach">
            </div>
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=4" alt="Forest">
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=5" alt="City">
            </div>
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <div class="image-container">
                <img src="https://picsum.photos/500/300?random=6" alt="Lake">
            </div>
            <figcaption>Lake</figcaption>
        </figure>

    </main>

</body>
</html>
