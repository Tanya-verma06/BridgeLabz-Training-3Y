<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Filter Gallery</h1>

<div class="gallery">
    <div class="image-card">
        <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
        <p>Blur Filter</p>
    </div>

    <div class="image-card">
        <img class="grayscale" src="https://picsum.photos/id/1016/400/300" alt="Forest">
        <p>Grayscale Filter</p>
    </div>

    <div class="image-card">
        <img class="sepia" src="https://picsum.photos/id/1018/400/300" alt="Nature">
        <p>Sepia Filter</p>
    </div>

    <div class="image-card">
        <img class="brightness" src="https://picsum.photos/id/1020/400/300" alt="River">
        <p>Brightness Filter</p>
    </div>

    <div class="image-card">
        <img class="contrast" src="https://picsum.photos/id/1024/400/300" alt="Animal">
        <p>Contrast Filter</p>
    </div>

    <div class="image-card">
        <img class="hue" src="https://picsum.photos/id/1035/400/300" alt="Landscape">
        <p>Hue-Rotate Filter</p>
    </div>
</div>

</body>
</html>
