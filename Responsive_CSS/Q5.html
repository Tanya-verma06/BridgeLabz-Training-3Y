<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Team</h1>

<div class="container">
    <div class="profile-card">
        <img class="gray" src="https://picsum.photos/id/1005/300/250" alt="Profile One">
        <h2>Alex</h2>
        <p>Web Designer</p>
    </div>

    <div class="profile-card">
        <img class="sepia" src="https://picsum.photos/id/1011/300/250" alt="Profile Two">
        <h2>Sarah</h2>
        <p>Frontend Developer</p>
    </div>

    <div class="profile-card">
        <img class="contrast" src="https://picsum.photos/id/1027/300/250" alt="Profile Three">
        <h2>John</h2>
        <p>UI/UX Designer</p>
    </div>
</div>

</body>
</html>
