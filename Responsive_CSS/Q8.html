<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Filter Comparison</h1>

<div class="comparison">

    <div class="image-box">
        <img src="https://picsum.photos/id/1015/500/350" alt="Original landscape">
        <h2>Before Filter</h2>
        <p>Original Image</p>
    </div>

    <div class="image-box">
        <img class="filtered" src="https://picsum.photos/id/1015/500/350" alt="Filtered landscape">
        <h2>After Filter</h2>
        <p>Hover over the image to remove the filter.</p>
    </div>

</div>

</body>
</html>
